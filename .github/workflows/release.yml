name: Criar release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Publicar pacotes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${SIGN_CSC_LINK:-}" ]; then
            export CSC_LINK="$SIGN_CSC_LINK"
            export CSC_KEY_PASSWORD="$SIGN_CSC_KEY_PASSWORD"
          fi
          if [ -n "${NOTARIZE_APPLE_ID:-}" ]; then
            export APPLE_ID="$NOTARIZE_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$NOTARIZE_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$NOTARIZE_APPLE_TEAM_ID"
          fi
          npm run release
